<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>VISITUAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #fffaf0; font-family: Arial, sans-serif; }
        .card { background: white; border-radius: 20px; box-shadow: 0 5px 22px rgba(0,0,0,0.07); }
        .hospital-card { border-left-width: 10px; }
        .tag { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 800; margin: 2px 2px 0 0; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; visibility: hidden; flex-direction: column; }
        .loading-overlay.active { visibility: visible; }
        .last-visit { font-size: 9px; color: #6b7280; background: #f3f4f6; padding: 1px 6px; border-radius: 4px; margin-top: 2px; display: inline-block; }
    </style>
</head>
<body class="pb-12">

<div id="loading" class="loading-overlay">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-red-600 mb-4"></div>
    <p class="font-bold text-red-800">Sincronizando com a Nuvem...</p>
</div>

<header class="bg-gradient-to-r from-red-800 to-red-500 text-center shadow-lg border-b-4 border-yellow-400">
    <div class="bg-white p-5">
        <img src="UAI.jpg" alt="Logo UAI" class="mx-auto w-20 h-20 object-contain mb-2">
       <p class="text-xs font-bold text-black uppercase text-center">Unidade de Alegria Intensiva</p>
    </div>
    <div class="py-3 px-4 text-white text-center">
        <h1 class="font-black text-xl text-center">VISITUAI</h1>
        <p class="text-[10px] text-yellow-100 font-bold uppercase tracking-widest mt-1 text-center">Banco de Dados Online Conectado</p>
    </div>
</header>

<main class="max-width: 500px; margin: auto;" class="max-w-xl mx-auto p-4 space-y-5">
    <div id="status" class="card p-4 text-center text-sm font-bold text-gray-500 italic">⏳ Inicializando...</div>

    <div class="card p-5">
        <label class="block text-xs font-black text-red-700 uppercase mb-2">DATA DA VISITUAI</label>
        <input type="date" id="data-plantao" class="w-full p-3 rounded-xl bg-red-50 border-2 border-red-100 font-bold outline-none">
    </div>

    <!-- Lista de Presença -->
    <div class="card p-5">
        <h2 class="font-black text-gray-800 text-lg flex justify-between items-center mb-4">
            Quem vai hoje? ✨
            <span id="contador" class="bg-red-600 text-white text-sm px-3 py-1 rounded-full">0</span>
        </h2>
        <div id="lista-presenca" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
    </div>

    <!-- Preferência Manual -->
    <div class="card p-5">
        <h2 class="font-black text-gray-800 text-lg mb-2 text-center">Preferência Manual 📍</h2>
        <div class="grid grid-cols-1 gap-3">
            <select id="manual-voluntario" class="p-3 rounded-xl border border-gray-200 font-bold text-xs"></select>
            <select id="manual-hospital" class="p-3 rounded-xl border border-gray-200 font-bold text-xs"></select>
            <button onclick="adicionarPreferenciaManual()" class="bg-amber-500 text-white font-black rounded-xl py-3 text-sm">FIXAR NO HOSPITAL</button>
        </div>
        <div id="lista-preferencias" class="mt-4 space-y-2"></div>
    </div>

    <button id="btn-gerar" onclick="gerarEscala()" disabled class="w-full bg-red-600 text-white font-black text-lg py-5 rounded-2xl shadow-lg disabled:opacity-40 transition">
        GERAR ESCALA 🎲
    </button>

    <section id="resultado" class="hidden space-y-4">
        <div id="equipes-hospitais" class="space-y-4"></div>
        <button onclick="copiarWhatsApp()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg">COPIAR PARA WHATSAPP 📱</button>
        <button id="btn-salvar" onclick="salvarNoSupabase()" class="w-full bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg">CONFIRMAR E SALVAR NA NUVEM ☁️</button>
        <p id="msg-sucesso" class="hidden text-center text-emerald-700 font-bold text-sm">✅ Escala salva com sucesso!</p>
    </section>
</main>

<script>
    const SUPABASE_URL = "https://xavoynadgllwtzounnfi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhdm95bmFkZ2xsd3R6b3VubmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjM1NDEsImV4cCI6MjA5MzU5OTU0MX0.-24uO3Qj82S8AeBDXmRbWNfXU35huFeBpbmFx9oo3AM";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    const HOSPITAIS = [
        { nome: "Santa Casa de Mogi Guaçu", cor: "border-blue-600", fundo: "bg-blue-50" },
        { nome: "Santa Casa de Mogi Mirim", cor: "border-emerald-600", fundo: "bg-emerald-50" },
        { nome: "Hospital São Francisco", cor: "border-purple-600", fundo: "bg-purple-50" },
        { nome: "Hospital 22 de Outubro", cor: "border-red-600", fundo: "bg-red-50" },
        { nome: "Hospital Tabajara", cor: "border-yellow-600", fundo: "bg-yellow-50", tabajara: true }
    ];

    let db = { voluntarios: [], historico: [] };
    let escalaAtual = [];
    let preferenciasManuais = [];

    document.getElementById("data-plantao").valueAsDate = new Date();

    function obterUltimaVisita(nome) {
        const visitas = db.historico.filter(h => h.voluntario === nome)
            .sort((a,b) => new Date(b.data) - new Date(a.data));
        return visitas.length > 0 ? visitas[0].hospital : "Estreia";
    }
    function normalizarTexto(valor) {
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
    }
    
    function obterUltimaVisita(nome) {
        const visitas = db.historico
            .filter(item => normalizarTexto(item.voluntario) === normalizarTexto(nome))
            .sort((a, b) => String(b.data).localeCompare(String(a.data)));
    
        return visitas.length ? visitas[0].hospital : "";
    }
    
    function equipePodeIrParaHospital(equipe, hospital) {
        return equipe.every(pessoa =>
            normalizarTexto(obterUltimaVisita(pessoa.nome)) !== normalizarTexto(hospital)
        );
    }

    async function carregarDados() {
        document.getElementById("loading").classList.add("active");
        try {
            const { data: v } = await _supabase.from('voluntarios').select('*');
            const { data: h } = await _supabase.from('historico_escalas').select('*');
            
            db.voluntarios = v || [];
            db.historico = h || [];

            renderizarPresenca();
            preencherSeletoresManuais();
            
            document.getElementById("btn-gerar").disabled = false;
            document.getElementById("status").innerText = "✅ Banco de dados sincronizado.";
        } catch (e) {
            document.getElementById("status").innerText = "❌ Erro ao carregar dados.";
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    function renderizarPresenca() {
        const lista = document.getElementById("lista-presenca");
        lista.innerHTML = "";
        [...db.voluntarios].sort((a,b) => a.nome.localeCompare(b.nome)).forEach(v => {
            const ultima = obterUltimaVisita(v.nome);
            const div = document.createElement("label");
            div.className = "flex items-center p-3 mb-2 bg-gray-50 border border-gray-100 rounded-xl cursor-pointer";
            div.innerHTML = `
                <input type="checkbox" value="${v.nome}" onchange="atualizarContador(); preencherSeletoresManuais();" class="w-5 h-5 accent-red-600 mr-3">
                <div class="flex-1">
                    <div class="font-bold text-sm text-gray-800">${v.nome}</div>
                    <div class="text-[10px] text-gray-500 uppercase">${v.sexo} · ${v.transporte} · ${v.experiencia}</div>
                    <div class="last-visit">📍 Último: ${ultima}</div>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    function atualizarContador() {
        document.getElementById("contador").innerText = document.querySelectorAll("#lista-presenca input:checked").length;
    }

    function preencherSeletoresManuais() {
        const vSel = document.getElementById("manual-voluntario");
        const hSel = document.getElementById("manual-hospital");
        const presentes = Array.from(document.querySelectorAll("#lista-presenca input:checked")).map(i => i.value);
        vSel.innerHTML = '<option value="">Quem?</option>';
        db.voluntarios.filter(p => presentes.includes(p.nome)).forEach(p => vSel.innerHTML += `<option value="${p.nome}">${p.nome}</option>`);
        hSel.innerHTML = '<option value="">Hospital?</option>';
        HOSPITAIS.forEach(h => hSel.innerHTML += `<option value="${h.nome}">${h.nome}</option>`);
    }

    function adicionarPreferenciaManual() {
        const v = document.getElementById("manual-voluntario").value;
        const h = document.getElementById("manual-hospital").value;
        if(!v || !h) return;
        preferenciasManuais.push({ voluntario: v, hospital: h });
        renderizarPreferencias();
    }

    function renderizarPreferencias() {
        const l = document.getElementById("lista-preferencias");
        l.innerHTML = preferenciasManuais.map((p,i) => `
            <div class="flex justify-between bg-amber-50 p-2 rounded-lg text-xs font-bold border border-amber-200">
                <span>${p.voluntario} → ${p.hospital}</span>
                <button onclick="preferenciasManuais.splice(${i},1); renderizarPreferencias();" class="text-red-600">X</button>
            </div>`).join("");
    }

   function gerarEscala() {
    const selecionados = Array.from(
        document.querySelectorAll("#lista-presenca input:checked")
    ).map(input => input.value);

    let presentes = db.voluntarios
        .filter(v => selecionados.includes(v.nome))
        .map(v => ({
            ...v,
            ultimaVisita: obterUltimaVisita(v.nome)
        }));

    if (presentes.length < 10) {
        alert("Selecione pelo menos 10 pessoas.");
        return;
    }

    presentes = presentes.sort(() => Math.random() - 0.5);

    const equipes = [];
    const usados = new Set();

    // 1. Mantém os pares "Sempre Junto" unidos.
    db.voluntarios.forEach(v => {
        if (!v.sempre_junto || usados.has(normalizarTexto(v.nome))) return;

        const pessoa = presentes.find(p => normalizarTexto(p.nome) === normalizarTexto(v.nome));
        const parceiro = presentes.find(p => normalizarTexto(p.nome) === normalizarTexto(v.sempre_junto));

        if (pessoa && parceiro) {
            equipes.push([pessoa, parceiro]);
            usados.add(normalizarTexto(pessoa.nome));
            usados.add(normalizarTexto(parceiro.nome));
        }
    });

   // 2. Cria as demais duplas.
// Prioridades:
// 1) Nunca colocar pessoas marcadas em "nunca_junto" na mesma equipe.
// 2) Preferir homem + mulher.
// 3) Preferir Veterano + Novato.
let restantes = presentes.filter(p => !usados.has(normalizarTexto(p.nome)));

function listaNuncaJunto(pessoa) {
    return String(pessoa.nunca_junto || "")
        .split(",")
        .map(nome => normalizarTexto(nome))
        .filter(Boolean);
}

function pessoasPodemFicarJuntas(pessoa1, pessoa2) {
    const nome1 = normalizarTexto(pessoa1.nome);
    const nome2 = normalizarTexto(pessoa2.nome);

    const bloqueiosPessoa1 = listaNuncaJunto(pessoa1);
    const bloqueiosPessoa2 = listaNuncaJunto(pessoa2);

    // Verifica nos dois sentidos:
    // Se A bloqueia B, ou B bloqueia A, eles não formam equipe.
    return !bloqueiosPessoa1.includes(nome2) &&
           !bloqueiosPessoa2.includes(nome1);
}

while (restantes.length >= 2) {
    const primeira = restantes.shift();

    // Melhor opção:
    // sexo diferente + experiência diferente + não estão em nunca_junto.
    let indiceParceiro = restantes.findIndex(pessoa =>
        pessoasPodemFicarJuntas(primeira, pessoa) &&
        normalizarTexto(pessoa.sexo) !== normalizarTexto(primeira.sexo) &&
        normalizarTexto(pessoa.experiencia) !== normalizarTexto(primeira.experiencia)
    );

    // Segunda opção:
    // sexo diferente + não estão em nunca_junto.
    if (indiceParceiro === -1) {
        indiceParceiro = restantes.findIndex(pessoa =>
            pessoasPodemFicarJuntas(primeira, pessoa) &&
            normalizarTexto(pessoa.sexo) !== normalizarTexto(primeira.sexo)
        );
    }

    // Terceira opção:
    // qualquer pessoa permitida pela regra nunca_junto.
    if (indiceParceiro === -1) {
        indiceParceiro = restantes.findIndex(pessoa =>
            pessoasPodemFicarJuntas(primeira, pessoa)
        );
    }

    // Situação excepcional: não existe outra combinação possível.
    // O sistema cria a dupla para não impedir a geração da escala.
    if (indiceParceiro === -1) {
        console.warn(
            `Não foi possível respeitar "nunca_junto" para ${primeira.nome}. ` +
            "Revise a escala gerada manualmente."
        );
        indiceParceiro = 0;
    }

    const segunda = restantes.splice(indiceParceiro, 1)[0];
    equipes.push([primeira, segunda]);
}

// Se houver uma pessoa sobrando, forma um trio.
// Ela é adicionada, de preferência, a uma equipe que não tenha conflito.
if (restantes.length) {
    const sobra = restantes.shift();

    let indiceEquipeSegura = equipes.findIndex(equipe =>
        equipe.every(pessoa => pessoasPodemFicarJuntas(sobra, pessoa))
    );

    if (indiceEquipeSegura === -1) {
        console.warn(
            `Não foi possível respeitar "nunca_junto" para a sobra: ${sobra.nome}. ` +
            "Revise a escala gerada manualmente."
        );
        indiceEquipeSegura = 0;
    }

    equipes[indiceEquipeSegura].push(sobra);
}

    if (equipes.length < 5) {
        alert("Não foi possível formar equipes suficientes para os 5 hospitais.");
        return;
    }

    const escala = HOSPITAIS.map(hospital => ({
        hospital,
        equipes: []
    }));

    const tabajara = escala.find(item => item.hospital.tabajara);
    const hospitaisNormais = escala.filter(item => !item.hospital.tabajara);

    // 3. Tabajara: exatamente uma dupla, preferencialmente homem + mulher,
    // e em que nenhum dos dois tenha ido ao Tabajara na última visita.
    const preferenciaTabajara = preferenciasManuais.find(p =>
        normalizarTexto(p.hospital) === normalizarTexto("Hospital Tabajara")
    );

    let indiceTabajara = -1;

    if (preferenciaTabajara) {
        indiceTabajara = equipes.findIndex(equipe =>
            equipe.length === 2 &&
            equipe.some(p => normalizarTexto(p.nome) === normalizarTexto(preferenciaTabajara.voluntario))
        );
    }

    if (indiceTabajara === -1) {
        indiceTabajara = equipes.findIndex(equipe =>
            equipe.length === 2 &&
            equipe.some(p => normalizarTexto(p.sexo) === "M") &&
            equipe.some(p => normalizarTexto(p.sexo) === "F") &&
            equipePodeIrParaHospital(equipe, "Hospital Tabajara")
        );
    }

    // Caso não exista dupla ideal, ainda garante que Tabajara receba apenas uma dupla.
    if (indiceTabajara === -1) {
        indiceTabajara = equipes.findIndex(equipe => equipe.length === 2);
    }

    if (indiceTabajara === -1) {
        alert("Não foi possível criar uma dupla para o Hospital Tabajara.");
        return;
    }

    tabajara.equipes.push(equipes.splice(indiceTabajara, 1)[0]);

    // 4. Preferências manuais dos hospitais normais.
    preferenciasManuais
        .filter(p => normalizarTexto(p.hospital) !== normalizarTexto("Hospital Tabajara"))
        .forEach(preferencia => {
            const destino = hospitaisNormais.find(item =>
                normalizarTexto(item.hospital.nome) === normalizarTexto(preferencia.hospital)
            );

            const indiceEquipe = equipes.findIndex(equipe =>
                equipe.some(p => normalizarTexto(p.nome) === normalizarTexto(preferencia.voluntario))
            );

            if (destino && indiceEquipe !== -1) {
                destino.equipes.push(equipes.splice(indiceEquipe, 1)[0]);
            }
        });

    // 5. Distribui o restante priorizando hospitais diferentes da última visita.
    equipes.forEach(equipe => {
        let destinosPossiveis = hospitaisNormais.filter(destino =>
            equipePodeIrParaHospital(equipe, destino.hospital.nome)
        );

        // Se não houver alternativa sem repetição, usa o hospital menos ocupado.
        if (!destinosPossiveis.length) {
            destinosPossiveis = hospitaisNormais;
        }

        destinosPossiveis.sort((a, b) => a.equipes.length - b.equipes.length);

        destinosPossiveis[0].equipes.push(equipe);
    });

    escalaAtual = escala;
    mostrarEscala();
}
    function mostrarEscala() {
        const area = document.getElementById("equipes-hospitais");
        area.innerHTML = escalaAtual.map(h => `
            <div class="hospital-card card p-4 mb-4 ${h.hospital.cor} ${h.hospital.fundo}">
                <h3 class="font-black text-xs uppercase mb-2 text-gray-800">${h.hospital.nome} ${h.hospital.tabajara ? ' (DUPLA)' : ''}</h3>
                ${h.equipes.map(eq => `
                    <div class="bg-white/70 p-2 rounded-lg mb-2 text-sm">
                        ${eq.map(p => `• <b>${p.nome}</b> <span class="text-[9px] text-gray-400"> (Vindo de: ${obterUltimaVisita(p.nome)})</span>`).join("<​br>")}
                    </div>
                `).join("")}
            </div>
        `).join("");
        document.getElementById("resultado").classList.remove("hidden");
        document.getElementById("btn-salvar").disabled = false;
        document.getElementById("msg-sucesso").classList.add("hidden");
    }

    async function salvarNoSupabase() {
        document.getElementById("loading").classList.add("active");
        try {
            const data = document.getElementById("data-plantao").value;
            const inserts = [];
            escalaAtual.forEach(h => {
                h.equipes.forEach(eq => eq.forEach(p => {
                    inserts.push({ data, hospital: h.hospital.nome, voluntario: p.nome });
                }));
            });
            const { error } = await _supabase.from('historico_escalas').insert(inserts);
            if (error) throw error;
            document.getElementById("msg-sucesso").classList.remove("hidden");
            document.getElementById("btn-salvar").disabled = true;
            alert("Sucesso! Escala registrada no histórico.");
            setTimeout(() => location.reload(), 2000);
        } catch (e) {
            alert("Erro ao salvar: " + e.message);
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    function copiarWhatsApp() {
        let txt = "*EQUIPE UAI - ESCALA*\n*Data:* " + document.getElementById("data-plantao").value + "\n\n";
        escalaAtual.forEach(h => {
            txt += `*${h.hospital.nome.toUpperCase()}*\n`;
            h.equipes.forEach((eq, i) => txt += `Eq ${i+1}: ${eq.map(p => p.nome).join(", ")}\n`);
            txt += "\n";
        });
        navigator.clipboard.writeText(txt);
        alert("Escala copiada!");
    }

    window.onload = carregarDados;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>UAI — Plantão da Alegria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #fffaf0; font-family: Arial, sans-serif; }
        .card { background: white; border-radius: 20px; box-shadow: 0 5px 22px rgba(0,0,0,0.07); }
        .hospital-card { border-left-width: 10px; }
        .tag { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 800; margin: 2px 2px 0 0; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; visibility: hidden; flex-direction: column; }
        .loading-overlay.active { visibility: visible; }
    </style>
</head>
<body class="pb-12">

<div id="loading" class="loading-overlay">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-red-600 mb-4"></div>
    <p class="font-bold text-red-800">Sincronizando com a Nuvem...</p>
</div>

<header class="bg-gradient-to-r from-red-800 to-red-500 text-center shadow-lg border-b-4 border-yellow-400">
    <div class="bg-white p-5">
        <img src="UAI.jpg" alt="Logo UAI" class="mx-auto w-20 h-20 object-contain mb-2">
       <p class="text-xs font-bold text-black uppercase text-center">Unidade de Alegria Intensiva</p>
    </div>
    <div class="py-3 px-4 text-white text-center">
        <h1 class="font-black text-xl text-center">PLANTÃO DA ALEGRIA</h1>
        <p class="text-[10px] text-yellow-100 font-bold uppercase tracking-widest mt-1 text-center">Banco de Dados Supabase Conectado</p>
    </div>
</header>

<main class="max-w-xl mx-auto p-4 space-y-5">
    <div id="status" class="card p-4 text-center text-sm font-bold text-gray-500 italic">⏳ Inicializando...</div>

    <div class="card p-5">
        <label class="block text-xs font-black text-red-700 uppercase mb-2">Data do plantão</label>
        <input type="date" id="data-plantao" class="w-full p-3 rounded-xl bg-red-50 border-2 border-red-100 font-bold outline-none">
    </div>

    <!-- Lista de Presença -->
    <div class="card p-5">
        <h2 class="font-black text-gray-800 text-lg flex justify-between items-center mb-4">
            Quem vai hoje? ✨
            <span id="contador" class="bg-red-600 text-white text-sm px-3 py-1 rounded-full">0</span>
        </h2>
        <div id="lista-presenca" class="space-y-2 max-h-96 overflow-y-auto pr-1">
            <p class="text-xs text-gray-400">Aguardando dados dos voluntários...</p>
        </div>
    </div>

    <!-- Preferência Manual -->
    <div class="card p-5">
        <h2 class="font-black text-gray-800 text-lg mb-2 text-center">Preferência Manual 📍</h2>
        <div class="grid grid-cols-1 gap-3">
            <select id="manual-voluntario" class="p-3 rounded-xl border border-gray-200 font-bold text-xs"></select>
            <select id="manual-hospital" class="p-3 rounded-xl border border-gray-200 font-bold text-xs"></select>
            <button onclick="adicionarPreferenciaManual()" class="bg-amber-500 text-white font-black rounded-xl py-3 text-sm">FIXAR NO HOSPITAL</button>
        </div>
        <div id="lista-preferencias" class="mt-4 space-y-2"></div>
    </div>

    <button id="btn-gerar" onclick="gerarEscala()" disabled class="w-full bg-red-600 text-white font-black text-lg py-5 rounded-2xl shadow-lg disabled:opacity-40 transition">
        GERAR ESCALA 🎲
    </button>

    <div id="avisos" class="hidden card p-4 border-2 border-yellow-300 bg-yellow-50"></div>

    <section id="resultado" class="hidden space-y-4">
        <div id="equipes-hospitais" class="space-y-4"></div>
        <button onclick="copiarWhatsApp()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg">COPIAR PARA WHATSAPP 📱</button>
        <button id="btn-salvar" onclick="salvarNoSupabase()" class="w-full bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg">CONFIRMAR E SALVAR NA NUVEM ☁️</button>
        <p id="msg-sucesso" class="hidden text-center text-emerald-700 font-bold text-sm">✅ Escala salva com sucesso!</p>
    </section>
</main>

<script>
    const SUPABASE_URL = "https://xavoynadgllwtzounnfi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhdm95bmFkZ2xsd3R6b3VubmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjM1NDEsImV4cCI6MjA5MzU5OTU0MX0.-24uO3Qj82S8AeBDXmRbWNfXU35huFeBpbmFx9oo3AM";
    
    // Inicialização robusta para evitar bloqueio de cookies/storage
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false }
    });

    const HOSPITAIS = [
        { nome: "Santa Casa de Mogi Guaçu", cor: "border-blue-600", fundo: "bg-blue-50" },
        { nome: "Santa Casa de Mogi Mirim", cor: "border-emerald-600", fundo: "bg-emerald-50" },
        { nome: "Hospital São Francisco", cor: "border-purple-600", fundo: "bg-purple-50" },
        { nome: "Hospital 22 de Outubro", cor: "border-red-600", fundo: "bg-red-50" },
        { nome: "Hospital Tabajara", cor: "border-yellow-600", fundo: "bg-yellow-50", tabajara: true }
    ];

    let db = { voluntarios: [], historico: [] };
    let escalaAtual = [];
    let preferenciasManuais = [];

    document.getElementById("data-plantao").valueAsDate = new Date();

    async function carregarDados() {
        console.log("Tentando carregar dados...");
        document.getElementById("status").innerText = "⏳ Acessando tabelas...";
        document.getElementById("loading").classList.add("active");

        try {
            // Teste de conexão simples
            const { data: v, error: ev } = await _supabase.from('voluntarios').select('*');
            if (ev) throw ev;
            console.log("Voluntários recebidos:", v);
            db.voluntarios = v;

            const { data: h, error: eh } = await _supabase.from('historico_escalas').select('*');
            if (eh) console.warn("Erro ao buscar histórico (pode estar vazio):", eh);
            db.historico = h || [];

            renderizarPresenca();
            preencherSeletoresManuais();
            
            document.getElementById("btn-gerar").disabled = false;
            document.getElementById("status").innerText = `✅ Sucesso! ${v.length} voluntários carregados.`;
            console.log("Interface atualizada.");
        } catch (e) {
            console.error("ERRO NO CARREGAMENTO:", e);
            document.getElementById("status").innerText = "❌ Erro: " + e.message;
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    function renderizarPresenca() {
        const lista = document.getElementById("lista-presenca");
        lista.innerHTML = "";
        
        const sorted = [...db.voluntarios].sort((a,b) => a.nome.localeCompare(b.nome));
        
        sorted.forEach(v => {
            const div = document.createElement("label");
            div.className = "flex items-center p-3 mb-2 bg-gray-50 border border-gray-100 rounded-xl cursor-pointer";
            div.innerHTML = `
                <input type="checkbox" value="${v.nome}" onchange="atualizarContador(); preencherSeletoresManuais();" class="w-5 h-5 accent-red-600 mr-3">
                <div class="flex-1">
                    <div class="font-bold text-sm">${v.nome}</div>
                    <div class="text-[10px] text-gray-500 uppercase">${v.sexo} · ${v.transporte} · ${v.experiencia}</div>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    function atualizarContador() {
        const n = document.querySelectorAll("#lista-presenca input:checked").length;
        document.getElementById("contador").innerText = n;
    }

    function preencherSeletoresManuais() {
        const vSel = document.getElementById("manual-voluntario");
        const hSel = document.getElementById("manual-hospital");
        const presentes = Array.from(document.querySelectorAll("#lista-presenca input:checked")).map(i => i.value);
        
        vSel.innerHTML = '<option value="">Quem?</option>';
        db.voluntarios.filter(p => presentes.includes(p.nome)).forEach(p => {
            vSel.innerHTML += `<option value="${p.nome}">${p.nome}</option>`;
        });

        hSel.innerHTML = '<option value="">Hospital?</option>';
        HOSPITAIS.forEach(h => hSel.innerHTML += `<option value="${h.nome}">${h.nome}</option>`);
    }

    function adicionarPreferenciaManual() {
        const v = document.getElementById("manual-voluntario").value;
        const h = document.getElementById("manual-hospital").value;
        if(!v || !h) return;
        preferenciasManuais.push({ voluntario: v, hospital: h });
        renderizarPreferencias();
    }

    function renderizarPreferencias() {
        const l = document.getElementById("lista-preferencias");
        l.innerHTML = preferenciasManuais.map((p,i) => `
            <div class="flex justify-between bg-amber-50 p-2 rounded-lg text-xs font-bold border border-amber-200">
                <span>${p.voluntario} → ${p.hospital}</span>
                <button onclick="preferenciasManuais.splice(${i},1); renderizarPreferencias();" class="text-red-600">X</button>
            </div>`).join("");
    }

    // Lógica rápida de escala
    function gerarEscala() {
        const selecionados = Array.from(document.querySelectorAll("#lista-presenca input:checked")).map(i => i.value);
        let presentes = db.voluntarios.filter(v => selecionados.includes(v.nome));

        if(presentes.length < 10) return alert("Selecione pelo menos 10 pessoas.");

        // Embaralhar
        presentes = presentes.sort(() => Math.random() - 0.5);

        // Criar equipes de 2 ou 3
        let equipes = [];
        const usados = new Set();

        // Casais (Sempre Junto)
        db.voluntarios.forEach(v => {
            if(v.sempre_junto && !usados.has(v.nome)) {
                const eu = presentes.find(p => p.nome === v.nome);
                const par = presentes.find(p => p.nome === v.sempre_junto);
                if(eu && par) {
                    equipes.push([eu, par]);
                    usados.add(eu.nome); usados.add(par.nome);
                }
            }
        });

        // Restante
        let restantes = presentes.filter(p => !usados.has(p.nome));
        while(restantes.length >= 2) {
            equipes.push([restantes.shift(), restantes.shift()]);
        }
        if(restantes.length) equipes[0].push(restantes.shift());

        // Distribuir nos hospitais
        const escala = HOSPITAIS.map(h => ({ hospital: h, equipes: [] }));
        
        // Tabajara
        const tab = escala.find(e => e.hospital.tabajara);
        tab.equipes.push(equipes.shift());

        // Outros
        let idx = 0;
        const normais = escala.filter(e => !e.hospital.tabajara);
        while(equipes.length) {
            normais[idx % normais.length].equipes.push(equipes.shift());
            idx++;
        }

        escalaAtual = escala;
        mostrarEscala();
    }

    function mostrarEscala() {
        const area = document.getElementById("equipes-hospitais");
        area.innerHTML = escalaAtual.map(h => `
            <div class="hospital-card card p-4 mb-4 ${h.hospital.cor} ${h.hospital.fundo}">
                <h3 class="font-black text-xs uppercase mb-2">${h.hospital.nome}</h3>
                ${h.equipes.map(eq => `
                    <div class="bg-white/70 p-2 rounded-lg mb-2 text-sm font-bold">
                        ${eq.map(p => `• ${p.nome}`).join("<​br>")}
                    </div>
                `).join("")}
            </div>
        `).join("");
        document.getElementById("resultado").classList.remove("hidden");
        document.getElementById("btn-salvar").disabled = false;
    }

    async function salvarNoSupabase() {
        document.getElementById("loading").classList.add("active");
        try {
            const data = document.getElementById("data-plantao").value;
            const inserts = [];
            escalaAtual.forEach(h => {
                h.equipes.forEach(eq => {
                    eq.forEach(p => {
                        inserts.push({ data, hospital: h.hospital.nome, voluntario: p.nome });
                    });
                });
            });

            const { error } = await _supabase.from('historico_escalas').insert(inserts);
            if (error) throw error;
            
            document.getElementById("msg-sucesso").classList.remove("hidden");
            document.getElementById("btn-salvar").disabled = true;
            alert("Salvo na nuvem com sucesso!");
        } catch (e) {
            alert("Erro ao salvar: " + e.message);
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    function copiarWhatsApp() {
        let txt = "*EQUIPE UAI - ESCALA*\n\n";
        escalaAtual.forEach(h => {
            txt += `*${h.hospital.nome.toUpperCase()}*\n`;
            h.equipes.forEach(eq => txt += eq.map(p => p.nome).join(", ") + "\n");
            txt += "\n";
        });
        navigator.clipboard.writeText(txt);
        alert("Escala copiada!");
    }

    // Início
    window.onload = carregarDados;
</script>
</body>
</html>

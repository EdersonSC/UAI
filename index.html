<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>UAI — Banco de Dados Online</title>

    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background: #fffaf0; font-family: Arial, sans-serif; }
        .card { background: white; border-radius: 20px; box-shadow: 0 5px 22px rgba(0, 0, 0, 0.07); }
        .hospital-card { border-left-width: 10px; }
        .tag { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 800; margin: 2px 2px 0 0; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; visibility: hidden; }
        .loading-overlay.active { visibility: visible; }
    </style>
</head>

<body class="pb-12">

    <div id="loading" class="loading-overlay flex-col">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-red-600 mb-4"></div>
        <p class="font-bold text-red-800">Sincronizando com Supabase...</p>
    </div>

    <header class="bg-gradient-to-r from-red-800 to-red-500 text-center shadow-lg border-b-4 border-yellow-400">
        <div class="bg-white p-5">
            <img src="UAI.jpg" alt="Logo UAI" class="mx-auto w-20 h-20 object-contain mb-2">
            <p class="text-xs font-bold text-red-900 uppercase">Unidade de Alegria Intensiva</p>
        </div>
        <div class="py-3 px-4 text-white">
            <h1 class="font-black text-xl">PLANTÃO ONLINE 🌐</h1>
            <p class="text-[10px] text-yellow-100 font-bold uppercase tracking-widest mt-1">Dados salvos na nuvem</p>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-5">

        <div id="status" class="card p-4 text-center text-sm font-bold text-gray-500 italic">
            Conectando ao banco...
        </div>

        <div class="card p-5">
            <label class="block text-xs font-black text-red-700 uppercase mb-2">Data do plantão</label>
            <input type="date" id="data-plantao" class="w-full p-3 rounded-xl bg-red-50 border-2 border-red-100 font-bold outline-none">
        </div>

        <div class="card p-5">
            <h2 class="font-black text-gray-800 text-lg flex justify-between items-center mb-4">
                Quem vai hoje? 🎭
                <span id="contador" class="bg-red-600 text-white text-sm px-3 py-1 rounded-full">0</span>
            </h2>
            <div id="lista-presenca" class="space-y-2 max-h-96 overflow-y-auto pr-1 text-sm"></div>
        </div>

        <div class="card p-5">
            <h2 class="font-black text-gray-800 text-lg mb-2">Preferência manual 📍</h2>
            <div class="grid grid-cols-1 gap-3">
                <select id="manual-voluntario" class="p-3 rounded-xl border border-gray-200 font-bold text-sm"></select>
                <select id="manual-hospital" class="p-3 rounded-xl border border-gray-200 font-bold text-sm"></select>
                <button onclick="adicionarPreferenciaManual()" class="bg-amber-500 text-white font-black rounded-xl py-3 text-sm">FIXAR NO HOSPITAL</button>
            </div>
            <div id="lista-preferencias" class="mt-4 space-y-2"></div>
        </div>

        <button id="btn-gerar" onclick="gerarEscala()" disabled class="w-full bg-red-600 text-white font-black text-lg py-5 rounded-2xl shadow-lg disabled:opacity-40 active:scale-95 transition">
            GERAR ESCALA 🎲
        </button>

        <div id="avisos" class="hidden card p-4 border-2 border-yellow-300 bg-yellow-50"></div>

        <section id="resultado" class="hidden space-y-4">
            <div id="equipes-hospitais" class="space-y-4"></div>
            
            <button onclick="copiarWhatsApp()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition">
                COPIAR PARA WHATSAPP 📱
            </button>

            <button id="btn-salvar-supabase" onclick="salvarNoSupabase()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition">
                CONFIRMAR E SALVAR NO BANCO ☁️
            </button>
            
            <p id="msg-sucesso" class="hidden text-center text-emerald-600 font-bold text-sm">✅ Escala salva com sucesso!</p>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://xavoynadgllwtzounnfi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_omKVNeBdKqBPPTWuKKBcPg_SIOrYHXh";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const HOSPITAIS = [
            { nome: "Santa Casa de Mogi Guaçu", cor: "border-blue-600", fundo: "bg-blue-50" },
            { nome: "Santa Casa de Mogi Mirim", cor: "border-emerald-600", fundo: "bg-emerald-50" },
            { nome: "Hospital São Francisco", cor: "border-purple-600", fundo: "bg-purple-50" },
            { nome: "Hospital 22 de Outubro", cor: "border-red-600", fundo: "bg-red-50" },
            { nome: "Hospital Tabajara", cor: "border-yellow-600", fundo: "bg-yellow-50", tabajara: true }
        ];

        let db = { voluntarios: [], historico: [] };
        let escalaAtual = [];
        let avisosAtuais = [];
        let preferenciasManuais = [];

        document.getElementById("data-plantao").valueAsDate = new Date();

        // --- CONEXÃO SUPABASE ---
        async function carregarDados() {
            mostrarLoading(true);
            try {
                // Carregar Voluntários
                const { data: v, error: ev } = await _supabase.from('voluntarios').select('*').eq('ativo', true);
                if (ev) throw ev;
                db.voluntarios = v;

                // Carregar Histórico
                const { data: h, error: eh } = await _supabase.from('historico_escalas').select('*');
                if (eh) throw eh;
                db.historico = h;

                renderizarPresenca();
                document.getElementById("btn-gerar").disabled = false;
                document.getElementById("status").innerText = `✅ Conectado: ${v.length} voluntários ativos.`;
            } catch (e) {
                console.error(e);
                document.getElementById("status").innerText = "❌ Erro ao conectar com Supabase.";
            } finally {
                mostrarLoading(false);
            }
        }

        async function salvarNoSupabase() {
            if (!escalaAtual.length) return;
            mostrarLoading(true);
            
            const dataPlantao = document.getElementById("data-plantao").value;
            const registros = [];

            escalaAtual.forEach(hosp => {
                hosp.equipes.forEach((equipe, idx) => {
                    equipe.forEach(p => {
                        registros.push({
                            data: dataPlantao,
                            hospital: hosp.hospital.nome,
                            equipe: `Equipe ${idx + 1}`,
                            voluntario: p.nome,
                            sexo: p.sexo,
                            experiencia: p.experiencia,
                            transporte: p.transporte
                        });
                    });
                });
            });

            try {
                const { error } = await _supabase.from('historico_escalas').insert(registros);
                if (error) throw error;
                
                document.getElementById("msg-sucesso").classList.remove("hidden");
                document.getElementById("btn-salvar-supabase").disabled = true;
                alert("Escala salva no banco de dados! Todos agora podem ver a rotatividade atualizada.");
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
            } finally {
                mostrarLoading(false);
            }
        }

        // --- LÓGICA DE ESCALA ---
        function normalizar(t) { return String(t || "").trim().toUpperCase(); }

        function renderizarPresenca() {
            const lista = document.getElementById("lista-presenca");
            lista.innerHTML = "";
            db.voluntarios.sort((a,b) => a.nome.localeCompare(b.nome)).forEach(v => {
                const item = document.createElement("label");
                item.className = "flex items-center p-3 bg-white border border-gray-100 rounded-xl cursor-pointer";
                item.innerHTML = `
                    <input type="checkbox" value="${v.nome}" onchange="atualizarContador(); preencherSeletores Manuais();" class="w-5 h-5 accent-red-600 mr-3">
                    <div>
                        <div class="font-bold">${v.nome}</div>
                        <div class="text-[10px] text-gray-400">${v.sexo} · ${v.transporte} · ${v.experiencia}</div>
                    </div>
                `;
                lista.appendChild(item);
            });
            preencherSeletoresManuais();
        }

        function atualizarContador() {
            document.getElementById("contador").innerText = document.querySelectorAll("#lista-presenca input:checked").length;
        }

        function preencherSeletoresManuais() {
            const vSel = document.getElementById("manual-voluntario");
            const hSel = document.getElementById("manual-hospital");
            const presentes = Array.from(document.querySelectorAll("#lista-presenca input:checked")).map(i => i.value);
            
            vSel.innerHTML = '<option value="">Quem?</option>';
            db.voluntarios.filter(p => presentes.includes(p.nome)).forEach(p => {
                vSel.innerHTML += `<option value="${p.nome}">${p.nome}</option>`;
            });

            hSel.innerHTML = '<option value="">Hospital?</option>';
            HOSPITAIS.forEach(h => hSel.innerHTML += `<option value="${h.nome}">${h.nome}</option>`);
        }

        function adicionarPreferenciaManual() {
            const v = document.getElementById("manual-voluntario").value;
            const h = document.getElementById("manual-hospital").value;
            if(!v || !h) return;
            preferenciasManuais.push({ voluntario: v, hospital: h });
            renderizarPreferencias();
        }

        function renderizarPreferencias() {
            const list = document.getElementById("lista-preferencias");
            list.innerHTML = preferenciasManuais.map((p, i) => `
                <div class="flex justify-between bg-amber-50 p-2 rounded-lg text-xs font-bold border border-amber-200">
                    <span>${p.voluntario} ➡️ ${p.hospital}</span>
                    <button onclick="preferenciasManuais.splice(${i},1); renderizarPreferencias();" class="text-red-600">X</button>
                </div>
            `).join("");
        }

        function ultimoHospitalDe(nome) {
            const registros = db.historico.filter(h => normalizar(h.voluntario) === normalizar(nome))
                .sort((a,b) => a.data.localeCompare(b.data));
            return registros.length ? registros[registros.length-1].hospital : "";
        }

        function gerarEscala() {
            avisosAtuais = [];
            const selecionados = Array.from(document.querySelectorAll("#lista-presenca input:checked")).map(i => i.value);
            let presentes = db.voluntarios.filter(v => selecionados.includes(v.nome))
                .map(v => ({ ...v, ultimoHospital: ultimoHospitalDe(v.nome) }));

            if (presentes.length < 10) return alert("Pelo menos 10 pessoas!");

            // Lógica Simplificada de Equipes (Respeitando Casais e Gênero)
            let equipes = [];
            
            // 1. Casais
            db.voluntarios.forEach(p => {
                if (p.sempre_junto) {
                    const eu = presentes.find(v => v.nome === p.nome);
                    const par = presentes.find(v => v.nome === p.sempre_junto);
                    if (eu && par) {
                        equipes.push([eu, par]);
                        presentes = presentes.filter(v => v.nome !== eu.nome && v.nome !== par.nome);
                    }
                }
            });

            // 2. Duplas Mistas
            presentes = presentes.sort(() => Math.random() - 0.5);
            while(presentes.length >= 2) {
                let p1 = presentes.shift();
                let p2Idx = presentes.findIndex(x => x.sexo !== p1.sexo);
                if (p2Idx === -1) p2Idx = 0;
                equipes.push([p1, presentes.splice(p2Idx, 1)[0]]);
            }
            // Sobras
            if(presentes.length) equipes[0].push(presentes.shift());

            // 3. Distribuir nos Hospitais
            let escala = HOSPITAIS.map(h => ({ hospital: h, equipes: [] }));
            
            // Regra Tabajara (1 casal)
            const tab = escala.find(e => e.hospital.tabajara);
            const manualTab = preferenciasManuais.find(p => p.hospital === "Hospital Tabajara");
            
            let idxTab = manualTab 
                ? equipes.findIndex(eq => eq.some(p => p.nome === manualTab.voluntario))
                : equipes.findIndex(eq => eq.length === 2 && eq[0].sexo !== eq[1].sexo);
            
            if(idxTab === -1) idxTab = 0;
            tab.equipes.push(equipes.splice(idxTab, 1)[0]);

            // Resto
            let i = 0;
            const normais = escala.filter(e => !e.hospital.tabajara);
            while(equipes.length > 0) {
                normais[i % normais.length].equipes.push(equipes.shift());
                i++;
            }

            escalaAtual = escala;
            document.getElementById("resultado").classList.remove("hidden");
            mostrarEscala();
        }

        function mostrarEscala() {
            const area = document.getElementById("equipes-hospitais");
            area.innerHTML = escalaAtual.map(h => `
                <div class="hospital-card card p-4 ${h.hospital.cor} ${h.hospital.fundo}">
                    <h3 class="font-black text-sm uppercase mb-2">${h.hospital.nome}</h3>
                    ${h.equipes.map(eq => `
                        <div class="bg-white/60 p-2 rounded-lg mb-2 text-sm">
                            ${eq.map(p => `<div>• <b>${p.nome}</b> <span class="text-[10px] text-gray-500">(${p.ultimoHospital || 'Estreia'})</span></div>`).join("")}
                        </div>
                    `).join("")}
                </div>
            `).join("");
            document.getElementById("btn-salvar-supabase").disabled = false;
            document.getElementById("msg-sucesso").classList.add("hidden");
        }

        function copiarWhatsApp() {
            let t = "*ESCALA UAI ONLINE* 🤡\n\n";
            escalaAtual.forEach(h => {
                t += `*${h.hospital.nome.toUpperCase()}*\n`;
                h.equipes.forEach((eq, i) => {
                    t += `Equipe ${i+1}: ${eq.map(p => p.nome).join(", ")}\n`;
                });
                t += "\n";
            });
            navigator.clipboard.writeText(t);
            alert("Copiado!");
        }

        function mostrarLoading(show) {
            document.getElementById("loading").className = `loading-overlay flex-col ${show ? 'active' : ''}`;
        }

        carregarDados();
    </script>
</body>
</html>
